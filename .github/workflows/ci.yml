name: Connector Protocol CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: go test ./... && go vet ./...
      - run: python3 conformance.py
      - run: python3 -m unittest discover -s python/tests -v
      - run: node --test typescript/test/session.test.mjs
      - run: |
          python3 build_echo.py --output ./dist/echo-connector
          python3 conformance.py --executable ./dist/echo-connector --manifest ./examples/echo.manifest.json
